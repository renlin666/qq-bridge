<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>账单记录 · QQ Bridge</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17243d;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:32px auto;padding:0 20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{margin:0;font-size:26px}h2{font-size:18px;margin:0 0 14px}.hint{color:#61718a;font-size:13px}.card{background:#fff;border:1px solid #dce3ed;border-radius:12px;padding:20px;margin-top:20px}.metrics{display:flex;flex-wrap:wrap;gap:20px}.metric{flex:1;min-width:160px}.metric strong{display:block;font-size:28px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}button,select,a.button{font:inherit;border:1px solid #cfd8e6;border-radius:7px;background:white;color:#2539a5;padding:7px 14px;cursor:pointer;text-decoration:none}button:hover,a.button:hover{background:#eef1ff}.table-scroll{overflow:auto;max-height:560px}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid #e7ebf2;text-align:right}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:#f5f7fc;color:#52627d}.error{color:#b32732}.ok{color:#117548}#chart{display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:1px solid #ccd5e4;margin:16px 0 5px}.bar{flex:1;min-width:2px;background:#5265ff;border-radius:3px 3px 0 0}.peak{background:#ae791f}.loading{padding:18px;color:#61718a}summary{cursor:pointer}select{max-width:100%}@media(max-width:600px){main{margin-top:18px;padding:0 12px}.card{padding:14px}header{align-items:flex-start}h1{font-size:22px}.metric{min-width:40%}.metric strong{font-size:24px}}
</style></head><body><main>
<header><div><h1>QQ Bridge · 账单记录</h1><div class="hint">读取现有用量账本，保留已退役会话的历史记录。</div></div><a class="button" id="consoleLink" href="/">完整控制台</a></header>
<section class="card"><div class="metrics"><div class="metric">累计折算金额<strong id="totalCost">—</strong></div><div class="metric">累计 token<strong id="totalTokens">—</strong></div><div class="metric">实际缓存命中率<strong id="hitRate">—</strong></div><div class="metric">可追溯回合<strong id="turnCount">—</strong></div></div>
<div class="row" style="margin-top:16px"><button id="refresh">刷新账单</button><span id="status" class="hint" role="status">正在读取…</span></div><p class="hint">金额按本地价目表折算，优先按原调用时间区分峰谷。没有逐轮回执的历史差额按快照时点估价；这不是供应商账单。预算中的90%不会替代实际命中率。</p></section>
<section class="card"><div class="row"><h2 style="margin:0">消耗走势</h2><select id="hours" aria-label="时间范围"><option value="24">近24小时</option><option value="72">近3天</option><option value="168">近7天</option><option value="720">近30天</option></select><span id="chartTotal" class="hint"></span></div><div id="chart"></div><div id="chartNote" class="hint"></div></section>
<section class="card"><h2>按会话查看</h2><div id="conversations" class="table-scroll loading">正在读取会话…</div></section>
<section class="card"><div class="row"><h2 style="margin:0">逐轮记录</h2><select id="conversation" aria-label="选择会话"></select></div><p id="turnScope" class="hint"></p><div id="turns" class="table-scroll loading">选择会话后显示明细。</div></section>
<section class="card"><details id="recentDetails"><summary>最近调用记录</summary><div id="recent" class="table-scroll loading">展开后读取。</div></details></section>
<noscript><p class="error">请启用JavaScript读取账本；原始记录保存在桥接的state/token-usage.jsonl中。</p></noscript>
</main><script>
(function(){
  var token='',selected='',busy=false;
  try{token=localStorage.getItem('consoleToken')||'';}catch(e){}
  var provided=new URLSearchParams(location.search).get('token');
  if(provided){token=provided;try{localStorage.setItem('consoleToken',token);}catch(e){}history.replaceState({},'',location.pathname);}
  document.getElementById('consoleLink').href='/?token='+encodeURIComponent(token)+'#usage';
  function el(id){return document.getElementById(id);}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function num(v){return Number(v||0).toLocaleString('zh-CN');}
  function money(v){return '¥'+Number(v||0).toFixed(4);}
  function pct(v){return (Number(v||0)*100).toFixed(1)+'%';}
  function time(v){return v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'—';}
  function textError(id,error){el(id).textContent='读取失败：'+error.message;el(id).classList.add('error');}
  function api(url){return fetch(url,{headers:{'x-console-token':token},cache:'no-store'}).then(function(r){if(r.status===401)throw new Error('登录已失效，请重新打开控制台入口');if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(r){if(r.ok===false)throw new Error(r.error||'接口返回失败');return r;});}
  function table(head,rows){return '<table><thead><tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>'+rows.map(function(row){return '<tr>'+row.map(function(x){return '<td>'+esc(x)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';}
  function loadTurns(){if(!selected)return Promise.resolve();var key=selected;return api('/api/tokens/turns?key='+encodeURIComponent(key)+'&limit=1000').then(function(r){if(key!==selected)return;var rows=r.turns||[];el('turnScope').textContent=key+' · '+rows.length+'轮 · 可追溯金额 '+money(r.attributedCost);el('turns').innerHTML=table(['轮次','时间','步数','未命中输入','命中输入','输出','金额','时段'],rows.map(function(t){var b=t.buckets||{};return ['#'+t.turn,time(t.endedAt),num(t.steps),num(b.cacheMiss),num(b.cacheHit),num(b.output),money(t.cost),t.tier==='peak'?'高峰':t.tier==='mixed'?'跨时段':'空闲'];}));el('turns').classList.remove('loading','error');}).catch(function(e){textError('turns',e);});}
  function loadSummary(){return api('/api/tokens/summary?limit=500').then(function(r){var t=r.totals||{},cs=r.conversations||[];el('totalCost').textContent=money(t.cost);el('totalTokens').textContent=num(t.totalTokens);el('hitRate').textContent=pct(t.cacheHitRate);el('turnCount').textContent=num(t.turns);el('conversations').innerHTML=table(['会话','轮数','步数','未命中输入','命中输入','输出','金额'],cs.map(function(c){var b=c.buckets||{};return [c.key,num(c.turns),num(c.steps),num(b.cacheMiss),num(b.cacheHit),num(b.output),money(c.cost)];}));el('conversations').classList.remove('loading','error');if(!cs.some(function(c){return c.key===selected;}))selected=cs.length?cs[0].key:'';el('conversation').innerHTML=cs.map(function(c){return '<option value="'+esc(c.key)+'"'+(c.key===selected?' selected':'')+'>'+esc(c.key)+'</option>';}).join('');el('status').textContent='已同步 '+new Date().toLocaleTimeString('zh-CN')+' · '+num(r.ledger&&r.ledger.samples)+'条有效调用';el('status').className='hint ok';return loadTurns();}).catch(function(e){textError('status',e);});}
  function loadChart(){return api('/api/tokens/series?hours='+el('hours').value).then(function(r){var rows=r.buckets||[],max=Math.max.apply(null,[0.000001].concat(rows.map(function(b){return Number(b.cost)||0;})));el('chart').innerHTML=rows.map(function(b){return '<div class="bar '+(b.tier==='peak'||b.tier==='mixed'?'peak':'')+'" style="height:'+Math.max(1,(b.cost||0)/max*100)+'%" title="'+esc(time(b.t)+' · '+money(b.cost)+' · '+num(b.steps)+'次调用')+'"></div>';}).join('');el('chartTotal').textContent='窗口合计 '+money(r.totals&&r.totals.cost);el('chartNote').textContent='蓝色为空闲，金色为高峰或跨时段。窗口外及未分时历史 '+money(r.offChartCost)+'；悬停查看明细。';}).catch(function(e){textError('chartNote',e);});}
  function loadRecent(){return api('/api/tokens/recent?limit=40').then(function(r){el('recent').innerHTML=table(['时间','会话','轮次','步骤','金额'],(r.entries||[]).map(function(x){return [time(x.time),x.key,'#'+x.turn,x.step,money(x.cost)];}));el('recent').classList.remove('loading','error');}).catch(function(e){textError('recent',e);});}
  function refresh(){if(busy)return;busy=true;Promise.all([loadSummary(),loadChart(),el('recentDetails').open?loadRecent():Promise.resolve()]).then(function(){busy=false;},function(){busy=false;});}
  el('refresh').onclick=refresh;el('conversation').onchange=function(){selected=this.value;loadTurns();};el('hours').onchange=loadChart;el('recentDetails').ontoggle=function(){if(this.open)loadRecent();};refresh();setInterval(function(){if(!document.hidden)refresh();},5000);
})();
</script></body></html>
